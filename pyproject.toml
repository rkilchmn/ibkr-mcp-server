[project]
name = "ibkr-mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.68.2",
  "uvicorn[standard]>=0.15.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "ib_async>=2.1.0",
  "pydantic>=1.10.13",
  "httpx>=0.18.2",
  "docker>=7.1.0",
  "asyncio>=3.4.3",
  "pydantic-settings>=2.10.1",
  "loguru>=0.7.3",
  "mcp>=1.12.0,<2.0.0",
  "pandas>=2.3.0",
  "exchange-calendars>=4.10.1",
  "defusedxml>=0.7.1",
  "fastapi-mcp>=0.4.0",
]

[project.scripts]
ibkr-mcp-server = "app.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]

[dependency-groups]
dev = [
    "ruff>=0.12.1",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
